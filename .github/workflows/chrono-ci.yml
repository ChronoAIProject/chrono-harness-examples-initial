# chrono-ci: owned github-actions/v1
name: "chrono-harness"
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev","integration/**"]
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit OID (omit only with initial)
        required: false
        type: string
      candidate:
        description: Full candidate commit OID
        required: true
        type: string
      initial:
        description: Explicit parentless initial inventory
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.event.deleted != true }}
    runs-on: "macos-26"
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Restore download cache tools
        id: chrono_download_0
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-release-tools-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/distribution.json') }}-${{ hashFiles('.chrono-harness/install.sh') }}"
          path: |
            .chrono-harness/bin/
          restore-keys: |
            chrono-download-v1-release-tools-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/distribution.json') }}-
          fail-on-cache-miss: false
      - name: Bootstrap registered tools
        shell: bash
        run: |
          '/bin/sh' '.chrono-harness/install.sh' '--host-root' '.'
      - name: Canonical harness check
        shell: bash
        env:
          CHRONO_CHECK_SOURCE: ci
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check'
      - name: Preserve actual check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
          include-hidden-files: true
      - name: Save download cache tools
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_download_0.outcome == 'success' && steps.chrono_download_0.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-release-tools-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/distribution.json') }}-${{ hashFiles('.chrono-harness/install.sh') }}"
          path: |
            .chrono-harness/bin/
